name: Streamlit image
on:
  push:
    branches: [main]
    paths:
      - streamlit_app.py
      - requirements.txt
      - Dockerfile.streamlit
      - docker-compose.streamlit.yml
      - .streamlit/**
      - .github/workflows/streamlit-image.yml
  pull_request:
    paths:
      - streamlit_app.py
      - requirements.txt
      - Dockerfile.streamlit
      - docker-compose.streamlit.yml
      - .streamlit/**
      - .github/workflows/streamlit-image.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.streamlit
          push: false
          tags: cleaning-laravelmail-streamlit:test
